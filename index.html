<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pakistan cattle farm management: herd, milk, breeding, health and accounts — offline-first PWA.">
  <meta name="theme-color" content="#2e7d32">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://eposwala.com https://cdn.jsdelivr.net; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cattle Farm">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
  <title>Cattle Farm Manager</title>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <img src="icons/logo.svg" alt="" width="88" height="88">
    <div class="fw-semibold mt-3">Cattle Farm Manager</div>
    <div class="spinner-border spinner-border-sm text-success mt-3" role="status"><span class="visually-hidden">Loading</span></div>
    <div id="splash-error" class="text-danger small mt-3 px-4 text-center"></div>
  </div>

  <!-- Login -->
  <div id="view-login" class="d-none">
    <div class="login-bg">
      <div class="login-wrap">
        <div class="login-card card shadow-lg overflow-hidden border-0">

          <!-- Farm scene header -->
          <div class="login-scene-wrap">
            <svg class="login-scene" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="lsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#90caf9"/><stop offset="100%" stop-color="#e3f2fd"/></linearGradient>
                <linearGradient id="lh1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#66bb6a"/><stop offset="100%" stop-color="#388e3c"/></linearGradient>
                <linearGradient id="lh2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4caf50"/><stop offset="100%" stop-color="#2e7d32"/></linearGradient>
                <filter id="sglow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              <!-- Sky -->
              <rect width="400" height="200" fill="url(#lsk)"/>
              <!-- Sun glow -->
              <circle cx="348" cy="44" r="36" fill="#fff59d" opacity="0.5" filter="url(#sglow)"/>
              <!-- Sun -->
              <circle cx="348" cy="44" r="22" fill="#ffd54f"/>
              <!-- Sun rays -->
              <g stroke="#ffd54f" stroke-width="2.5" opacity="0.7" stroke-linecap="round">
                <line x1="348" y1="14" x2="348" y2="6"/><line x1="348" y1="74" x2="348" y2="82"/>
                <line x1="318" y1="44" x2="310" y2="44"/><line x1="378" y1="44" x2="386" y2="44"/>
                <line x1="327" y1="23" x2="321" y2="17"/><line x1="369" y1="65" x2="375" y2="71"/>
                <line x1="369" y1="23" x2="375" y2="17"/><line x1="327" y1="65" x2="321" y2="71"/>
              </g>
              <!-- Clouds -->
              <g opacity="0.88">
                <ellipse cx="75" cy="32" rx="36" ry="16" fill="white"/>
                <ellipse cx="98" cy="26" rx="28" ry="14" fill="white"/>
                <ellipse cx="52" cy="30" rx="22" ry="12" fill="white"/>
              </g>
              <g opacity="0.72">
                <ellipse cx="205" cy="50" rx="28" ry="13" fill="white"/>
                <ellipse cx="225" cy="44" rx="22" ry="11" fill="white"/>
                <ellipse cx="188" cy="48" rx="18" ry="10" fill="white"/>
              </g>
              <!-- Back hill -->
              <ellipse cx="200" cy="220" rx="280" ry="110" fill="#81c784"/>
              <!-- Mid hills -->
              <ellipse cx="80" cy="210" rx="200" ry="95" fill="url(#lh1)"/>
              <ellipse cx="340" cy="205" rx="200" ry="90" fill="#4caf50"/>
              <!-- Ground strip -->
              <rect x="0" y="158" width="400" height="42" fill="url(#lh2)"/>
              <!-- Tree left -->
              <rect x="30" y="124" width="7" height="38" fill="#5d4037" rx="3"/>
              <ellipse cx="33" cy="116" rx="20" ry="22" fill="#2e7d32"/>
              <ellipse cx="33" cy="108" rx="14" ry="16" fill="#388e3c"/>
              <!-- Barn -->
              <rect x="305" y="110" width="56" height="50" fill="#c62828" rx="2"/>
              <polygon points="299,110 367,110 333,80" fill="#b71c1c"/>
              <rect x="324" y="130" width="18" height="30" fill="#4e342e" rx="1"/>
              <rect x="308" y="116" width="14" height="12" fill="#ffcdd2" rx="1"/>
              <rect x="335" y="116" width="14" height="12" fill="#ffcdd2" rx="1"/>
              <!-- Fence -->
              <g stroke="#8d6e63" stroke-width="2.2" stroke-linecap="round">
                <line x1="100" y1="158" x2="296" y2="158"/>
                <line x1="100" y1="148" x2="296" y2="148"/>
                <line x1="110" y1="144" x2="110" y2="163"/>
                <line x1="140" y1="144" x2="140" y2="163"/>
                <line x1="170" y1="144" x2="170" y2="163"/>
                <line x1="200" y1="144" x2="200" y2="163"/>
                <line x1="230" y1="144" x2="230" y2="163"/>
                <line x1="260" y1="144" x2="260" y2="163"/>
                <line x1="290" y1="144" x2="290" y2="163"/>
              </g>
              <!-- Cow silhouette -->
              <g transform="translate(158,118)" fill="#3e2723">
                <ellipse cx="28" cy="18" rx="30" ry="17" fill="#4e342e"/>
                <ellipse cx="58" cy="12" rx="16" ry="12" fill="#4e342e"/>
                <ellipse cx="72" cy="16" rx="9" ry="7" fill="#6d4c41"/>
                <ellipse cx="59" cy="3" rx="6" ry="8" fill="#4e342e" transform="rotate(-20 59 3)"/>
                <path d="M58 2 Q52 -10 59 -13 Q63 -6 60 2" fill="#bcaaa4"/>
                <rect x="6" y="31" width="6" height="17" fill="#4e342e" rx="2"/>
                <rect x="18" y="31" width="6" height="17" fill="#4e342e" rx="2"/>
                <rect x="34" y="31" width="6" height="17" fill="#4e342e" rx="2"/>
                <rect x="46" y="31" width="6" height="17" fill="#4e342e" rx="2"/>
                <path d="M-2 16 Q-14 6 -11 -2 Q-6 1 -7 10" fill="none" stroke="#4e342e" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="16" cy="34" rx="10" ry="6" fill="#ef9a9a"/>
                <ellipse cx="26" cy="10" rx="10" ry="8" fill="white" opacity="0.35"/>
              </g>
              <!-- Grass tufts -->
              <g fill="#2e7d32">
                <path d="M0 200 Q5 190 10 200 Q15 190 20 200 Q25 190 30 200Z"/>
                <path d="M50 200 Q55 192 60 200 Q65 192 70 200Z"/>
                <path d="M370 200 Q375 192 380 200 Q385 192 390 200Z"/>
              </g>
            </svg>
            <!-- Brand overlay at bottom of scene -->
            <div class="login-brand-bar">
              <img src="icons/logo.svg" alt="Cattle Farm Logo" width="46" height="46" class="login-logo-img">
              <div>
                <div class="login-brand-name" id="login-title">Cattle Farm Manager</div>
                <div class="login-brand-sub">Pakistan's Farm Management App</div>
              </div>
            </div>
          </div>

          <!-- Form area -->
          <div class="login-form-area">
            <div id="login-notice" class="alert alert-warning small d-none"></div>
            <form id="login-form" novalidate>
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="login-username" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                <label for="login-username" id="login-username-label">Username</label>
              </div>
              <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
                <label for="login-password" id="login-password-label">Password</label>
                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-body-secondary" id="toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button>
              </div>
              <div id="login-error" class="alert alert-danger py-2 small d-none"></div>
              <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold" id="login-btn">Sign in</button>
            </form>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <button class="btn btn-outline-secondary btn-sm" id="lang-toggle">اردو</button>
              <div class="small text-body-secondary" id="login-conn"></div>
            </div>
          </div>

        </div>
        <div class="text-center small login-footer-note mt-3" id="login-internet-note">Internet is required to sign in. After sign-in the app works offline.</div>
      </div>
    </div>
  </div>

  <!-- Application -->
  <div id="view-app" class="d-none">
    <aside id="sidebar" class="d-none d-lg-flex flex-column">
      <div class="sidebar-brand">
        <img src="icons/logo.svg" alt="" width="30" height="30" class="brand-logo">
        <span id="brand-name">Cattle Farm</span>
      </div>
      <nav class="nav flex-column flex-grow-1 overflow-auto nav-menu" aria-label="Main"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <button class="btn btn-link text-body d-lg-none px-1" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas" aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
        <div class="fw-semibold text-truncate flex-grow-1" id="topbar-title">Dashboard</div>
        <span id="conn-badge" class="badge rounded-pill conn-online" title="Connection status"><i class="bi bi-wifi"></i> <span>Online</span></span>
        <button class="btn btn-link text-body px-1 btn-sm" id="lang-toggle" title="Toggle language"><i class="bi bi-translate"></i></button>
        <div class="dropdown">
          <button class="btn btn-link text-body px-1" data-bs-toggle="dropdown" aria-label="Account"><i class="bi bi-person-circle fs-5"></i></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><div class="dropdown-item-text small"><div class="fw-semibold" id="user-name"></div><div class="text-body-secondary" id="user-role"></div></div></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear me-2"></i>Settings</a></li>
            <li><button class="dropdown-item d-none" id="install-btn"><i class="bi bi-download me-2"></i>Install app</button></li>
            <li><button class="dropdown-item text-danger" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Log out</button></li>
          </ul>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
    </div>
    <nav id="bottom-nav" class="d-lg-none" aria-label="Quick navigation">
      <a href="#/dashboard" data-route="dashboard"><i class="bi bi-house"></i><span>Home</span></a>
      <a href="#/animals" data-route="animals"><i class="bi bi-collection"></i><span>Animals</span></a>
      <a href="#/milk" data-route="milk" class="nav-milk"><i class="bi bi-droplet-half-fill"></i><span>Milk</span></a>
      <a href="#/buyers" data-route="buyers"><i class="bi bi-people"></i><span>Buyers</span></a>
      <a href="#" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas"><i class="bi bi-grid"></i><span>More</span></a>
    </nav>
  </div>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="menu-offcanvas" aria-labelledby="menu-title">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menu-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0"><nav class="nav flex-column nav-menu" aria-label="Main"></nav></div>
  </div>

  <div id="toast-container" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3"></div>
  <div id="loading-overlay" class="d-none"><div class="bg-body rounded-3 shadow p-3 d-flex align-items-center gap-2"><div class="spinner-border spinner-border-sm text-success"></div><span class="loading-text">Please wait…</span></div></div>
  <div id="print-area" aria-hidden="true"></div>

  <noscript><div class="alert alert-danger m-3">JavaScript is required to run this application.</div></noscript>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
